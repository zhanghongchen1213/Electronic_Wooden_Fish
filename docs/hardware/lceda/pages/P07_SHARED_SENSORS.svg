inejoin="round" stroke-linecap="round"/><rect x="932.5" y="142" width="35" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="950" y="155" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="950" dy="0">SA0=高</tspan></text><path d="M 1386 333 L 1430 333" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#std-arrow-blue)"/><rect x="1457.5" y="314" width="105" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="1510" y="327" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="1510" dy="0">IMU_INT1 → IO41</tspan></text><path d="M 1386 419 L 1430 419" fill="none" stroke="#b42318" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><rect x="1468" y="400" width="84" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="1510" y="413" fill="#b42318" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="1510" dy="0">NC / 不占 IO45</tspan></text><rect x="520" y="560" width="840" height="190" rx="4" fill="#fff8db" stroke="#0b5cab" stroke-width="1.3"/><text x="532" y="582" fill="#0b5cab" font-size="12px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="532" dy="0">同一总线上的其他器件</tspan></text><text x="532" y="603" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="532" dy="0">U1 BQ25895：0x6A（P01）</tspan></text><text x="532" y="620" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="532" dy="0">U10 CST9217：0x5A（P03）</tspan></text><text x="532" y="637" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="532" dy="0">U11 ES8311：0x18（P04）</tspan></text><text x="532" y="654" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="532" dy="0">地址冲突时先改硬件基线/spine，再改固件；不要静默兼容多个地址</tspan></text><rect x="60" y="560" width="390" height="190" rx="4" fill="#fff8db" stroke="#13795b" stroke-width="1.3"/><text x="72" y="582" fill="#13795b" font-size="12px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">测试点</tspan></text><text x="72" y="603" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">TP_I2C_SDA</tspan></text><text x="72" y="620" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">TP_I2C_SCL</tspan></text><text x="72" y="637" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">TP_IMU_INT1</tspan></text><text x="72" y="654" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">上电扫描日志必须保留</tspan></text><text x="72" y="671" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">QMI8658C MVP 默认不启用，仅首版贴装</tspan></text><rect x="60" y="810" width="1610" height="80" rx="4" fill="#fff8db" stroke="#b42318" stroke-width="1.3"/><text x="72" y="832" fill="#b42318" font-size="12px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">封装提醒</tspan></text><text x="72" y="853" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">CW2015/QMI8658C 的具体封装、SA0/INT 电平和去耦按实际采购批次核对；图中地址是首版合同，不是样机 ACK 结果。</tspan></text><path d="M48 1010H1750" stroke="#98a2b3"/><text x="48" y="1033" fill="#667085" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="48" dy="0">P07 · 共享总线地址必须唯一；先扫描再冻结驱动配置。</tspan></text><text x="1740" y="1033" fill="#b42318" font-size="10px" font-weight="700" text-anchor="end" font-family="Arial, PingFang SC, sans-serif"><tspan x="1740" dy="0">STATUS: BASELINE / NOT ERC</tspan></text>
