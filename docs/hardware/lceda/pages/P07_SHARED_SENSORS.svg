      <text x="48" y="42" fill="#172033" font-size="22px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="48" dy="0">P07  共享 I²C / CW2015 / QMI8658C</tspan></text><text x="48" y="66" fill="#475467" font-size="11px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="48" dy="0">I2C0 总线、4.7 kΩ 上拉、地址表与 INT1/INT2 处理</tspan></text><rect x="1360" y="30" width="380" height="62" fill="#ffffff" stroke="#98a2b3"/><text x="1375" y="51" fill="#475467" font-size="11px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="1375" dy="0">电子木鱼 / HARDWARE BASELINE</tspan></text><text x="1375" y="73" fill="#667085" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="1375" dy="0">逻辑原理图 · 手工复刻参考 · V1.0</tspan></text><rect x="48" y="92" width="1700" height="70" rx="4" fill="#fff8db" stroke="#0b5cab" stroke-width="1.3"/><text x="60" y="114" fill="#0b5cab" font-size="12px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="60" dy="0">I²C 地址与上拉</tspan></text><text x="60" y="135" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="60" dy="0">I2C0：SDA=IO1、SCL=IO2，统一 3V3 上拉 4.7 kΩ。首版地址 BQ=0x6A、CW2015=0x62、CST9217=0x5A、ES8311=0x18、QMI8658C=0x6B，必须上电扫描。</tspan></text><path d="M260 215V242h-10v36h20v-36h-10v27M260 278V305" fill="none" stroke="#172033" stroke-width="2"/><text x="278" y="257" fill="#172033" font-size="11px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="278" dy="0">R_SDA</tspan><tspan x="278" dy="14">4.7 kΩ</tspan></text><path d="M360 215V242h-10v36h20v-36h-10v27M360 278V305" fill="none" stroke="#172033" stroke-width="2"/><text x="378" y="257" fill="#172033" font-size="11px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="378" dy="0">R_SCL</tspan><tspan x="378" dy="14">4.7 kΩ</tspan></text><path d="M260 208V190m-7 7 7-7 7 7" class="std-thin"/><text x="272" y="194" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="272" dy="0">3V3</tspan></text><path d="M360 208V190m-7 7 7-7 7 7" class="std-thin"/><text x="372" y="194" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="372" dy="0">3V3</tspan></text><path d="M 260 305 L 260 470" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="214.5" y="442" width="91" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="260" y="455" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="260" dy="0">I2C_SDA / IO1</tspan></text><path d="M 360 305 L 360 470" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="314.5" y="442" width="91" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="360" y="455" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="360" dy="0">I2C_SCL / IO2</tspan></text><rect x="520" y="220" width="340" height="220" rx="4" fill="#ffffff" stroke="#13795b" stroke-width="2"/><text x="690" y="245" fill="#13795b" font-size="15px" font-weight="700" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="690" dy="0">U13</tspan></text><text x="690" y="265" fill="#344054" font-size="11px" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="690" dy="0">CW2015 · 地址 0x62 候选</tspan></text><path d="M494 323H520" class="std-thin"/><text x="490" y="327" fill="#13795b" font-size="10px" font-weight="400" text-anchor="end" font-family="Arial,