      <text x="48" y="42" fill="#172033" font-size="22px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="48" dy="0">P05  PVDF 敲击模拟前端 / ADC / 唤醒</tspan></text><text x="48" y="66" fill="#475467" font-size="11px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="48" dy="0">LDT0-028K · 1 MΩ 限流 · 低漏钳位 · TLV2369 · TLV7042</tspan></text><rect x="1360" y="30" width="380" height="62" fill="#ffffff" stroke="#98a2b3"/><text x="1375" y="51" fill="#475467" font-size="11px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="1375" dy="0">电子木鱼 / HARDWARE BASELINE</tspan></text><text x="1375" y="73" fill="#667085" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="1375" dy="0">逻辑原理图 · 手工复刻参考 · V1.0</tspan></text><rect x="48" y="92" width="1700" height="70" rx="4" fill="#fff8db" stroke="#b42318" stroke-width="1.3"/><text x="60" y="114" fill="#b42318" font-size="12px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="60" dy="0">PVDF 保护优先级</tspan></text><text x="60" y="135" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="60" dy="0">LDT0-028K 的压电瞬态可能很高；1 MΩ 限流、低漏钳位和 10 MΩ 泄放先保证 ADC 安全，再调阈值/滞回。IO11 只唤醒，IO9 ADC 二次确认。</tspan></text><rect x="70" y="280" width="190" height="150" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><text x="165" y="302" fill="#9a6700" font-size="14px" font-weight="700" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="165" dy="0">J6/S1</tspan></text><text x="165" y="320" fill="#344054" font-size="10px" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="165" dy="0">LDT0-028K</tspan></text><path d="M260 359.5H295" class="std-thin"/><text x="300" y="362.5" fill="#9a6700" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="300" dy="0">1 PVDF+</tspan></text><path d="M260 398.5H295" class="std-thin"/><text x="300" y="401.5" fill="#9a6700" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="300" dy="0">2 PVDF−</tspan></text><path d="M315 355H342v-10h36v20h-36v-10h27M378 355H405" fill="none" stroke="#172033" stroke-width="2"/><text x="360" y="338" fill="#172033" font-size="11px" font-weight="700" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="360" dy="0">R_PVDF_SER</tspan></text><text x="360" y="383" fill="#344054" font-size="11px" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="360" dy="0">1 MΩ</tspan></text><path d="M 295 359.5 L 315 359.5 L 315 355" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="287" y="327" width="56" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="315" y="340" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="315" dy="0">PVDF_RAW</tspan></text><path d="M 405 355 L 520 355" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="438.5" y="327" width="63" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="470" y="340" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="470" dy="0">PVDF_COND</tspan></text><path d="M580 255V286M566 286l14 24 14-24M580 310v35" fill="none" stroke="#b42318" stroke-width="2"/><text x="600" y="298" fill="#b42318" font-size="11px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="600" dy="0">D_CL+</tspan><tspan x="600" dy="14">低漏钳位</tspan></text><path d="M650 365V396M636 396l14 24 14-24M650 4