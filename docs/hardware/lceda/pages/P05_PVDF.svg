ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="1360" dy="0">PVDF_ADC → IO9</tspan></text><path d="M855 565L950 620L855 675Z" fill="#ffffff" stroke="#b42318" stroke-width="2"/><text x="866" y="598" fill="#b42318" font-size="18px" font-weight="700" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="866" dy="0">−</tspan></text><text x="866" y="649" fill="#b42318" font-size="18px" font-weight="700" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="866" dy="0">+</tspan></text><text x="910" y="538" fill="#b42318" font-size="12px" font-weight="700" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="910" dy="0">U16</tspan></text><text x="910" y="698" fill="#344054" font-size="11px" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif"><tspan x="910" dy="0">TLV7042 双窗比较器</tspan></text><path d="M 950 355 L 820 355 L 820 592 L 820 648" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="792" y="562" width="56" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="820" y="575" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="820" dy="0">PVDF_BUF</tspan></text><path d="M 1315 730 L 1080 730 L 1080 648 L 820 592" fill="none" stroke="#13795b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="1082" y="703" width="56" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="1110" y="716" fill="#13795b" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="1110" dy="0">VBIAS/阈值</tspan></text><path d="M 950 620 L 1060 620 L 1430 620" fill="none" stroke="#b42318" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#std-arrow)"/><rect x="1190" y="592" width="140" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="1260" y="605" fill="#b42318" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="1260" dy="0">PVDF_CMP_WAKE → IO11</tspan></text><path d="M895 558V540m-7 7 7-7 7 7" class="std-thin"/><text x="907" y="544" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="907" dy="0">3V3</tspan></text><path d="M895 700v10m-12 0h24m-8 6h16m-4 6h8" class="std-thin"/><text x="913" y="717" fill="#172033" font-size="11px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="913" dy="0">GND</tspan></text><path d="M1260 685V712h-10v36h20v-36h-10v27M1260 748V775" fill="none" stroke="#172033" stroke-width="2"/><text x="1278" y="727" fill="#172033" font-size="11px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="1278" dy="0">R_VBIAS_TOP</tspan><tspan x="1278" dy="14">10 kΩ</tspan></text><path d="M1370 685V712h-10v36h20v-36h-10v27M1370 748V775" fill="none" stroke="#172033" stroke-width="2"/><text x="1388" y="727" fill="#172033" font-size="11px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="1388" dy="0">R_VBIAS_BOT</tspan><tspan x="1388" dy="14">10 kΩ</tspan></text><path d="M1260 673V655m-7 7 7-7 7 7" class="std-thin"/><text x="1272" y="659" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="1272" dy="0">3V3</tspan></text><path d="M1370 790v10m-12 0h24m-8 6h16m-4 6h8" class="std-thin"/><text x="1388" y="807" fill="#172033" font-size="11px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="1388" dy="0">GND</tspan></text><path d="M 1260 775 L 1315 730 L 1370 685" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="1276.5" y="702" width="77" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="1315" y="715" fill="#0b5cab" font-size="11px" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="1315" dy="0">VBIAS≈1.65V</tspan></text><circle cx="285" cy="530" r="9" fill="#ffffff" stroke="#6941c6" stroke-width="2"/><text x="300" y="527" fill="#6941c6" font-size="11px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="300" dy="0">TP_RAW</tspan></text><text x="300" y="542" fill="#6941c6" font-size="10px" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="300" dy="0">PVDF_RAW</tspan></text><circle cx="470" cy="530" r="9" fill="#ffffff" stroke="#6941c6" stroke-width="2"/><text x="485" y="527" fill="#6941c6" font-size="11px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="485" dy="0">TP_ADC</tspan></text><text x="485" y="542" fill="#6941c6" font-size="10px" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="485" dy="0">PVDF_ADC</tspan></text><circle cx="655" cy="530" r="9" fill="#ffffff" stroke="#6941c6" stroke-width="2"/><text x="670" y="527" fill="#6941c6" font-size="11px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="670" dy="0">TP_CMP</tspan></text><text x="670" y="542" fill="#6941c6" font-size="10px" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="670" dy="0">PVDF_CMP_WAKE</tspan></text><rect x="60" y="800" width="1610" height="100" rx="4" fill="#fff8db" stroke="#b42318" stroke-width="1.3"/><text x="72" y="822" fill="#b42318" font-size="12px" font-weight="700" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">必须样机验证</tspan></text><text x="72" y="843" fill="#172033" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="72" dy="0">比较器具体封装/输出形式、钳位型号与漏电、阈值约 1.65 V ±150 mV、滞回、消抖和 1–20 次/秒输入都只是可调初值；不得把原始波形保存或上传。</tspan></text><path d="M48 1010H1750" stroke="#98a2b3"/><text x="48" y="1033" fill="#667085" font-size="10px" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, sans-serif"><tspan x="48" dy="0">P05 · 先验证 ADC 输入安全范围，再调整比较器阈值；IO11 为唤醒而非计数事实源。</tspan></text><text x="1740" y="1033" fill="#b42318" font-size="10px" font-weight="700" text-anchor="end" font-family="Arial, PingFang SC, sans-serif"><tspan x="1740" dy="0">STATUS: BASELINE / NOT ERC</tspan></text>
